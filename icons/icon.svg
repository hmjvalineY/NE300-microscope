<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f4f9c"/><stop offset="1" stop-color="#13294b"/></linearGradient>
    <linearGradient id="wh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e0ea"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 262) scale(0.82) translate(-256 -256)">
    <!-- 白色底座 -->
    <rect x="96" y="414" width="300" height="34" rx="12" fill="url(#wh)"/>
    <!-- 鏡臂（C 形） -->
    <path d="M300 414 L340 150 Q346 112 312 108 L190 108 L190 142 L276 142 Q292 142 290 160 L262 414 Z" fill="url(#wh)"/>
