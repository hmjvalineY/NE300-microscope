    <path d="M128 414 L128 368 Q128 350 146 350 L262 350 L262 414 Z" fill="#1b1c1f"/>
    <rect x="150" y="376" width="44" height="26" rx="4" fill="#cfe7e1"/>
    <ellipse cx="200" cy="350" rx="34" ry="8" fill="#9ad0ff"/>
    <!-- 調節輪 -->
    <circle cx="262" cy="392" r="26" fill="#2c2e33" stroke="#111" stroke-width="4"/>
    <circle cx="262" cy="392" r="11" fill="#555a63"/>
    <!-- 載物台與聚光鏡 -->
    <rect x="104" y="262" width="196" height="24" rx="8" fill="#1b1c1f"/>
    <rect x="150" y="256" width="90" height="8" rx="3" fill="#c9cdd3"/>
    <rect x="164" y="288" width="72" height="16" rx="6" fill="#2c2e33"/>
    <rect x="170" y="292" width="60" height="5" fill="#4aa3e8"/>
    <!-- 旋轉盤與物鏡 -->
    <path d="M150 176 Q200 154 252 170 L246 196 Q200 184 156 200 Z" fill="#2c2e33"/>
    <rect x="186" y="196" width="26" height="54" rx="6" fill="#dfe3e8"/>
    <rect x="186" y="214" width="26" height="6" fill="#38a2e0"/>
    <rect x="218" y="190" width="22" height="40" rx="6" fill="#c9cdd3" transform="rotate(-18 229 210)"/>
    <!-- 三眼觀察筒（梯形）＋相機接口 -->
    <path d="M168 108 L190 44 L282 44 L304 108 Z" fill="#1b1c1f"/>
    <rect x="216" y="18" width="40" height="30" rx="6" fill="#26282c"/>
    <!-- 目鏡筒 -->
    <rect x="96" y="58" width="106" height="30" rx="10" fill="#26282c" transform="rotate(-27 150 73)"/>
    <rect x="70" y="38" width="40" height="40" rx="10" fill="#111214" transform="rotate(-27 90 58)"/>
    <ellipse cx="82" cy="54" rx="10" ry="15" fill="#3d6fa8" transform="rotate(-27 82 54)"/>
