<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13294b">
<meta name="description" content="TEKFAR NE300 複式光學顯微鏡 3D 模型與互動教學：操作、光圈、景深、水埋玻片、染色、目鏡測微器校正與測量">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NE300顯微鏡">
<title>NE300 顯微鏡互動教室</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <button class="hbtn" id="btn-nav" title="展開/收合章節">☰</button>
  <span class="logo">TEKFAR</span>
  <h1><span class="t-long">NE300 複式光學顯微鏡｜互動學習與虛擬實驗</span><span class="t-short">NE300 顯微鏡</span></h1>
  <span class="sp"></span>
  <button class="hbtn" id="btn-install" hidden title="安裝成 App">📲 安裝 App</button>
  <button class="hbtn m-only" id="btn-ctl" title="操作面板">🎛 操作</button>
  <button class="hbtn m-only" id="btn-lesson" title="說明與任務">📖 說明</button>
  <button class="hbtn" id="btn-help">使用說明</button>
  <button class="hbtn" id="btn-reset" title="把顯微鏡恢復到收納狀態">重設顯微鏡</button>
  <button class="hbtn" id="btn-set">設定</button>
</header>
<div id="rotate-hint" hidden><div class="rh-box"><div class="rh-ic">📱↻</div><b>請把手機橫放使用</b><p>橫向畫面才放得下 3D 顯微鏡和目鏡視野。<br>（若已橫放仍看到此提示，請關閉手機的「直向鎖定」）</p><button class="btn" id="rh-ok">仍要直式使用</button></div></div>
<div id="drawer-mask"></div>
<div id="app">
  <nav id="nav"></nav>
  <main id="main">
    <div id="bench">
      <div id="bench-top">
        <div id="three-wrap">
          <canvas id="three"></canvas>
          <div class="cam-btns" id="cam-btns"></div>
          <div id="gap-badge"></div>
          <div id="tooltip"></div>
          <div class="hint3d">拖曳空白處旋轉｜右鍵平移｜滾輪縮放｜拖曳或滾動旋鈕可直接操作</div>
        </div>
        <div id="eye-wrap">
          <canvas id="eyeview"></canvas>
          <div id="eye-label"></div>
          <div id="eye-meter"></div>
          <div id="eye-msg"></div>
        </div>
      </div>
      <div id="controls"></div>
    </div>
    <div id="scene-wrap" hidden><canvas id="scene"></canvas></div>
  </main>
  <aside id="lesson"></aside>
</div>
<script src="js/vendor/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"><\/script>');</script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/specimens.js"></script>
<script src="js/orbit.js"></script>
<script src="js/model.js"></script>
<script src="js/view.js"></script>
<script src="js/hands.js"></script>
<script src="js/bench.js"></script>
<script src="js/wizard.js"></script>
<script src="js/scenes.js"></script>
<script src="js/lessons.js"></script>
<script src="js/mobile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
